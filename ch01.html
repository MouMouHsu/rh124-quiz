<footer class="foot"><div class="wrap">練習題依簡報「RH124 - CH01 Introduction to RHEL」編寫，非 Red Hat 官方考題。</div></footer>
<script>window.QUIZ = { key: "CH01", questions: [{"q": "According to the chapter, which two operating systems are the dominant platforms in the modern data center?", "o": ["Linux and Microsoft Windows", "AIX and HP-UX", "Microsoft Windows and Solaris", "Linux and macOS"], "a": 0, "e": "教材指出 Linux 與 Microsoft Windows 並列現代資料中心兩大主流作業系統。", "s": 4}, {"q": "Which statement about Linux and supercomputers is made in the chapter?", "o": ["Linux is only used on supercomputers for storage", "Linux runs none of the top 500 supercomputers", "Linux runs most of the world's top 500 supercomputers", "Supercomputers mainly run Microsoft Windows"], "a": 2, "e": "教材提到 Linux 執行全球前 500 大超級電腦中的大多數。", "s": 4}, {"q": "Which of the following is NOT one of the three main features of Linux described in the chapter?", "o": ["A powerful command-line interface (CLI)", "Mandatory per-seat license fees", "A modular operating system design", "Open source code"], "a": 1, "e": "Linux 三大特色為開放原始碼、強大的 CLI 與模組化設計；授權費並非其特色。", "s": 5}, {"q": "Why does the CLI make Linux administration easier to automate?", "o": ["The CLI is only available on the local console", "The CLI can only run one command per session", "All administration tasks can be performed from the CLI", "The CLI requires a graphical desktop to run"], "a": 2, "e": "所有管理任務皆可透過 CLI 完成，因此容易自動化、部署與配置，並同時支援本地與遠端管理。", "s": 5}, {"q": "What does Linux's modular design allow?", "o": ["Modules can only be added by the original vendor", "Every installation must include the full graphical desktop", "Components can be replaced or removed as needed, from a full workstation to a minimal appliance image", "Only the kernel can be changed; all other components are fixed"], "a": 2, "e": "模組化設計讓元件可依需求替換或移除，可作為通用開發工作站，也可作為精簡設備映像。", "s": 5}, {"q": "What is open source software?", "o": ["Software whose source code anyone can freely use, study, modify, and share", "Software that is free to run but whose code cannot be viewed", "Software that has no copyright", "Software that is only distributed by Red Hat"], "a": 0, "e": "開源軟體是任何人都可自由使用、研究、修改並分享原始碼的軟體。", "s": 7}, {"q": "What is source code?", "o": ["The license file attached to a program", "The checksum used to verify a download", "The compiled binary file that the CPU runs", "The human-readable instructions that make a program work"], "a": 3, "e": "原始碼是讓程式運作的人類可讀指令集，一經建立即受著作權保護。", "s": 7}, {"q": "Who decides the distribution terms of source code?", "o": ["The end user", "The hardware vendor", "The copyright holder", "The Linux kernel maintainers"], "a": 2, "e": "程式碼一建立即受著作權保護，由著作權人決定散佈條款。", "s": 7}, {"q": "What does proprietary (closed source) software typically allow users to do?", "o": ["Merge the code into other projects freely", "Recompile and redistribute the program", "Only run the program", "View and modify the source code"], "a": 2, "e": "閉源軟體通常只授權使用者執行程式，無法查閱或修改原始碼。", "s": 7}, {"q": "Which open source user benefit means you can verify that code behaves as expected and improve it?", "o": ["Stability", "Control", "Training", "Certification"], "a": 1, "e": "透明控制 (Control) 是指可查看程式碼的實際行為，確認符合預期並加以改善。", "s": 8}, {"q": "Which open source user benefit means code can survive even if the original developer disappears?", "o": ["Security", "Training", "Stability", "Control"], "a": 2, "e": "穩定性 (Stability) 指程式碼的存活不依賴原開發者或廠商。", "s": 8}, {"q": "Which open source user benefit lets you inspect sensitive code and fix vulnerabilities without the original developer?", "o": ["Security", "Modularity", "Stability", "Training"], "a": 0, "e": "安全性 (Security) 指可自行檢查敏感程式碼，即使原開發者無法配合也能修復漏洞。", "s": 8}, {"q": "Which open source user benefit refers to learning from real-world code to build better applications?", "o": ["Control", "Security", "Training", "Stability"], "a": 2, "e": "學習資源 (Training) 指從真實世界的程式碼中學習，開發更有效的應用程式。", "s": 8}, {"q": "What must every open source license allow users to do?", "o": ["Distribute binaries but never source code", "Freely use, view, modify, compile, and distribute the code", "Use the code only for non-commercial purposes", "Only view the code without modifying it"], "a": 1, "e": "所有開源授權都必須允許使用者自由使用、查看、修改、編譯及散佈程式碼。", "s": 9}, {"q": "What is the core principle of a copyleft license?", "o": ["The code may be used in any product, including proprietary ones, with no conditions", "The code can be used only by the original author", "Anyone who distributes the code must pass on the freedom to copy, modify, and distribute it", "The license must be renewed every year"], "a": 2, "e": "Copyleft (share-alike) 要求散佈原始碼 (含修改版) 的人，必須保留他人複製、修改與散佈的自由。", "s": 9}, {"q": "Which license is an example of a copyleft license?", "o": ["Apache License 2.0", "Simplified BSD License", "MIT License", "GNU General Public License (GPL)"], "a": 3, "e": "GPL 與 LGPL 是 Copyleft 授權的常見範例；MIT、BSD、Apache 屬於 Permissive 授權。", "s": 9}, {"q": "What is the design goal of a permissive license?", "o": ["To maximize code reusability, including use in proprietary products", "To keep all derivative works open source", "To prevent commercial use of the code", "To require payment for each redistribution"], "a": 0, "e": "Permissive 授權追求最大可重用性，只要保留著作權與授權聲明，可用於任何目的，包含閉源產品。", "s": 9}, {"q": "Which license is an example of a permissive license?", "o": ["A share-alike license", "GNU GPL", "GNU Lesser GPL (LGPL)", "Apache License 2.0"], "a": 3, "e": "MIT/X11、Simplified BSD 與 Apache License 2.0 屬於 Permissive 授權。", "s": 9}, {"q": "Under a permissive license, what must be retained when reusing the code?", "o": ["A royalty payment record", "A copy of the full source code in every product", "The original developer's contact information", "The copyright and license notices"], "a": 3, "e": "Permissive 授權只要求保留著作權聲明與授權說明。", "s": 9}, {"q": "Who are most open source developers today, according to the chapter?", "o": ["University students only", "Unpaid volunteers only", "Government employees", "Professional developers employed by companies"], "a": 3, "e": "開源開發已專業化，大多數開源開發者受僱於企業並被指派參與開源專案。", "s": 10}, {"q": "What is a Linux distribution?", "o": ["A graphical desktop environment", "A hardware certification program", "A version of the Linux kernel source code only", "An installable operating system built from the Linux kernel that supports user programs and libraries"], "a": 3, "e": "Linux 發行版是由 Linux kernel 建構、可安裝並支援使用者程式與函式庫的作業系統。", "s": 12}, {"q": "In which year did Linus Torvalds develop the Linux kernel?", "o": ["2001", "1991", "1983", "1995"], "a": 1, "e": "1991 年研究生 Linus Torvalds 開發了類 UNIX kernel，命名為 Linux。", "s": 12}, {"q": "Under which license was the Linux kernel released?", "o": ["MIT", "GPL", "Apache License 2.0", "BSD"], "a": 1, "e": "Linus Torvalds 以 GPL 授權將 Linux kernel 釋出為開源軟體。", "s": 12}, {"q": "What is the role of the kernel?", "o": ["It stores user documents", "It manages hardware, memory, and the scheduling of running programs", "It provides the graphical desktop", "It installs and updates software packages"], "a": 1, "e": "Kernel 是作業系統核心，負責管理硬體、記憶體及執行中程式的排程。", "s": 12}, {"q": "Which graphics platform is mentioned as combining with the Linux kernel and GNU tools to form a complete OS?", "o": ["Wayland", "DirectX", "Quartz", "Metal"], "a": 0, "e": "Linux kernel 搭配 GNU 工具、Wayland 圖形平台及其他開源元件，組成完整的類 UNIX 作業系統。", "s": 12}, {"q": "Which is a common characteristic of Linux distributions?", "o": ["They are supported only by volunteers", "They provide a way to install and update software and its components", "They never include the Linux kernel", "They must contain thousands of programs"], "a": 1, "e": "發行版提供安裝與更新軟體及其元件的機制；規模可從精簡到數千套程式不等。", "s": 12}, {"q": "Which software-defined storage project does Red Hat participate in?", "o": ["Ceph", "Rawhide", "Kubernetes", "Wayland"], "a": 0, "e": "Red Hat 參與 Ceph 軟體定義儲存專案。", "s": 13}, {"q": "What is the first step in how Red Hat develops software into RHEL?", "o": ["Stabilizing software into RHEL", "Participating in upstream communities", "Releasing RHEL Beta", "Selling subscriptions"], "a": 1, "e": "三步驟依序為：參與上游社群、贊助 Fedora 整合、穩定化至 RHEL。", "s": 15}, {"q": "What role does Fedora play in Red Hat's development process?", "o": ["A container-only operating system", "The long-term supported production release", "A paid enterprise support tier", "A development lab and proving ground for new features"], "a": 3, "e": "Red Hat 贊助 Fedora 並將開源專案整合其中，作為新功能的開發實驗室與驗證環境。", "s": 15}, {"q": "In the RHEL ecosystem diagram, which component provides content to Red Hat CoreOS in the OpenShift area?", "o": ["Fedora", "EPEL", "Fedora Rawhide", "RHEL"], "a": 3, "e": "RHEL 屬於企業區，並提供元件給雲端區的 UBI 與 OpenShift 區的 Red Hat CoreOS。", "s": 16}, {"q": "How often does Fedora release a major version?", "o": ["Every year", "Every six months", "Every three years", "Every ten years"], "a": 1, "e": "Fedora 每六個月發布一次主要版本。", "s": 17}, {"q": "Why is Fedora less suitable for production environments needing long-term support?", "o": ["Fedora requires a paid subscription", "Each release is supported for only about one year (the latest two releases)", "Fedora does not use the Linux kernel", "Fedora has no package manager"], "a": 1, "e": "Fedora 每個版本約支援一年，即只支援最新兩個版本，不適合需長期支援的正式環境。", "s": 17}, {"q": "Who builds and maintains EPEL?", "o": ["The CentOS Board", "The Linux kernel maintainers", "A Fedora Special Interest Group (SIG)", "Red Hat Support"], "a": 2, "e": "EPEL 由 Fedora 的特殊興趣小組 (SIG) 建構與維護。", "s": 18}, {"q": "Which statement about EPEL packages is correct?", "o": ["They are not covered by Red Hat support", "They are included in every RHEL installation", "They are only available for Fedora", "They are fully supported by Red Hat"], "a": 0, "e": "EPEL 套件不在 Red Hat 支援範圍內，但品質相當於 Fedora 水準。", "s": 18}, {"q": "What is EPEL Next used for?", "o": ["Testing new Fedora kernels", "Building packages against CentOS Stream when it contains library versions not yet in RHEL", "Distributing UBI container images", "Providing paid support for EPEL"], "a": 1, "e": "EPEL Next 供維護者針對 CentOS Stream 建置，適用於 CentOS Stream 已包含但 RHEL 尚未納入的函式庫版本。", "s": 18}, {"q": "What is CentOS Stream's relationship to RHEL?", "o": ["It is unrelated to RHEL", "It is a downstream rebuild of RHEL", "It is the paid version of RHEL", "It is the continuous delivery upstream of RHEL"], "a": 3, "e": "CentOS Stream 是 RHEL 的上游持續整合開發版本。", "s": 19}, {"q": "What was CentOS Linux before 2019?", "o": ["A paid Red Hat product", "The development lab for the Linux kernel", "A downstream clone of RHEL", "The upstream of Fedora"], "a": 2, "e": "2019 年前的 CentOS Linux 是 RHEL 發布後才建置的下游克隆版，因貢獻難回饋與更新延遲而改為 CentOS Stream 模式。", "s": 19}, {"q": "What delivery model does CentOS Stream use?", "o": ["Continuous integration and continuous delivery (CI/CD) with daily tested builds", "A major release every ten years with no updates", "Weekly untested snapshots", "Manual releases only when customers request them"], "a": 0, "e": "CentOS Stream 採 CI/CD 模式，提供每日經測試且穩定的建置版本。", "s": 19}, {"q": "How does Red Hat charge for RHEL?", "o": ["Through a per-CPU perpetual license fee", "Through a one-time license for the source code", "Through a subscription for support, with no license fee for the open source software", "It is free with no support options"], "a": 2, "e": "RHEL 採訂閱制支援模式，不收開源軟體授權費；訂閱提供支援、安全補丁與 Customer Portal 資源。", "s": 20}, {"q": "From which project are RHEL major versions built directly?", "o": ["UBI", "CentOS Stream", "EPEL", "Fedora Rawhide"], "a": 1, "e": "RHEL 主要版本直接從 CentOS Stream 持續開發專案建構。", "s": 20}, {"q": "What is the expected life cycle of RHEL?", "o": ["12–18 months", "5 years", "10 years", "3 years"], "a": 2, "e": "比較表中 RHEL 的預期生命週期為 10 年。", "s": 21}, {"q": "What is the expected life cycle of CentOS Stream?", "o": ["5 years", "12–18 months", "1 year", "10 years"], "a": 0, "e": "比較表中 CentOS Stream 的預期生命週期為 5 年。", "s": 21}, {"q": "Which feature is available for Fedora, CentOS Stream, and RHEL alike?", "o": ["A free option", "A product security team", "Expert technical support", "Management tools"], "a": 0, "e": "三者都有免費選項；專家支援、產品安全團隊與管理工具只有 RHEL 提供。", "s": 21}, {"q": "Which RHEL tool lets IT teams build and maintain images optimized for specific edge architectures?", "o": ["Fedora Rawhide", "EPEL Next", "CRI-O", "Image builder"], "a": 3, "e": "RHEL 提供 image builder，可建構、部署並維護針對特定邊緣架構最佳化的映像。", "s": 22}, {"q": "How is RHCOS released and managed?", "o": ["As part of Red Hat OpenShift Container Platform (RHOCP)", "As a Fedora spin", "As a standalone operating system", "As an EPEL package"], "a": 0, "e": "RHCOS 不是獨立作業系統，而是作為 RHOCP 的一部分發布、升級與管理。", "s": 23}, {"q": "Which container engine standard does RHCOS use?", "o": ["CRI-O", "Hyper-V", "LXC only", "Docker Swarm"], "a": 0, "e": "RHCOS 使用整合於 RHOCP 中、符合 CRI-O 標準的 Container 引擎。", "s": 23}, {"q": "What is Red Hat Universal Base Image (UBI)?", "o": ["A paid RHEL edition for bare metal", "A hardware certification image", "A Fedora development branch", "A freely redistributable derivative of RHEL designed for container applications"], "a": 3, "e": "UBI 本質上是可自由再散佈的 RHEL 衍生版本，專為 Container 與 Web 應用開發設計。", "s": 24}, {"q": "What is Fedora Rawhide?", "o": ["The upstream of CentOS Stream for RHEL minor releases only", "Fedora's continuous development environment for the next Fedora release", "The long-term supported release of Fedora", "A RHEL edge image"], "a": 1, "e": "Fedora Rawhide 是 Fedora 的持續開發環境，為下一個 Fedora 版本測試新 kernel、Driver 與工具。", "s": 25}, {"q": "Which Fedora release was the source code base for RHEL 10 and CentOS Stream 10?", "o": ["Fedora 40", "Fedora 41", "Fedora 42", "Fedora 38"], "a": 0, "e": "示意圖說明 Fedora 40 是 RHEL 10 與 CentOS Stream 10 的原始程式碼基礎。", "s": 26}, {"q": "What happens when a RHEL evaluation (trial) period ends?", "o": ["All data is deleted", "The system immediately stops booting", "The system converts to Fedora", "Support ends, but the evaluation software continues to work"], "a": 3, "e": "RHEL 評估版需免費 Customer Portal 帳號；期滿後支援結束，但軟體仍可繼續運作。", "s": 27}] };</script>
