<script>window.QUIZ = { key: "CH08", questions: [{"q": "What is a fundamental design principle of Linux regarding system configuration?", "o": ["Information and configuration settings are stored in text files", "Configuration is stored in a binary registry", "Configuration is stored in the kernel image", "Configuration can only be changed in a graphical tool"], "a": 0, "e": "Linux 的基本設計原則是把資訊與設定存放在文字檔中，任何文字編輯器都能編輯。", "s": 4}, {"q": "Which structured formats are mentioned as examples of configuration text files?", "o": ["JPEG and PNG", "PDF and DOCX", "EXE and DLL", "XML and YAML"], "a": 3, "e": "設定檔可為設定清單、INI 類格式，或結構化的 XML 與 YAML。", "s": 4}, {"q": "What is the key reason for learning Vim, according to the chapter?", "o": ["It requires a graphical desktop", "It is almost always installed by default on servers", "It is the only editor that supports Unicode", "It is only available on RHEL"], "a": 1, "e": "學習 Vim 的關鍵理由是伺服器上幾乎一定預設安裝它。", "s": 4}, {"q": "Which standard specifies the vi editor?", "o": ["ISO 9001", "POSIX", "IEEE 802.11", "FHS only"], "a": 1, "e": "POSIX 標準指定了 vi 編輯器，許多類 UNIX 系統亦然。", "s": 4}, {"q": "Which other operating system currently includes a lightweight Vim by default?", "o": ["Windows 11", "macOS", "iOS", "Android"], "a": 1, "e": "macOS 預設包含輕量版 Vim，因此 Vim 技能在其他系統也能用上。", "s": 4}, {"q": "Why do you not need a graphical desktop to edit configuration files on a server?", "o": ["Configuration files can only be edited by the kernel", "Graphical desktops are banned in RHEL", "You can edit text files in a terminal through ssh or the Web Console", "Servers cannot store configuration files"], "a": 2, "e": "透過 SSH 或 Web Console 登入，即可在終端機直接編輯文字設定檔。", "s": 4}, {"q": "Which package installs the vi editor with core features only?", "o": ["vim-minimal", "vim-common", "vimtutor", "vim-enhanced"], "a": 0, "e": "vim-minimal 提供具核心功能的 vi 編輯器，屬於輕量安裝。", "s": 5}, {"q": "Which package provides the vim command, the online help system, and a tutorial program?", "o": ["vim-help", "vim-x11", "vim-enhanced", "vim-minimal"], "a": 2, "e": "vim-enhanced 提供更完整的功能、線上說明系統與 vimtutor。", "s": 5}, {"q": "After installing vim-enhanced, what happens when a regular user runs vi?", "o": ["vi is removed", "A shell alias runs vim instead", "vi runs only in read-only mode", "vi opens nano"], "a": 1, "e": "安裝 vim-enhanced 後會設定 Shell 別名，一般使用者執行 vi 時自動改用 vim。", "s": 5}, {"q": "For which users does the vi-to-vim alias NOT apply?", "o": ["Users in the wheel group", "Users logged in through SSH", "All users with a UID above 1000", "root and users with a UID below 200"], "a": 3, "e": "這個別名不適用於 root 與 UID 小於 200 的系統服務帳號。", "s": 5}, {"q": "How can a regular user temporarily bypass the vi alias to run the original vi?", "o": ["Type sudo vi", "Type \\vi", "Type vim -o", "Type vi!"], "a": 1, "e": "輸入 \\vi 可暫時略過別名，使用原始 vi。", "s": 5}, {"q": "How can you compare the feature sets of vi and vim?", "o": ["Read /etc/vimrc", "Run vimtutor --compare", "Run diff vi vim", "Run each with the --version option"], "a": 3, "e": "可用 vi 與 vim 各自加上 --version 比較功能集。", "s": 5}, {"q": "Which mode is Vim in when it first opens a file?", "o": ["Visual mode", "Command mode", "Insert mode", "Extended command mode"], "a": 1, "e": "剛開啟 Vim 時預設進入 Command Mode。", "s": 6}, {"q": "Why must you always know which Vim mode you are in?", "o": ["Some modes delete the file", "Modes change the file permissions", "Only one mode can save files", "The same key has different effects in different modes"], "a": 3, "e": "同一個按鍵在不同模式中效果不同，因此必須確認目前模式。", "s": 6}, {"q": "Which key enters Insert mode from Command mode?", "o": ["v", "u", "i", "x"], "a": 2, "e": "按 I 進入 Insert Mode，輸入的文字都會成為檔案內容。", "s": 6}, {"q": "Which key returns from Insert mode to Command mode?", "o": ["Esc", "Tab", "Enter", "Ctrl+D"], "a": 0, "e": "在 Insert Mode 按 Esc 回到 Command Mode。", "s": 6}, {"q": "Which key enters Extended Command mode?", "o": [":", "!", "/", "Esc"], "a": 0, "e": "按冒號鍵進入 Extended Command Mode，用於儲存與離開等工作。", "s": 6}, {"q": "Which key enters Visual mode for selecting characters?", "o": ["v", "a", "y", "i"], "a": 0, "e": "按 v 進入 Visual Mode 選取多個字元。", "s": 6}, {"q": "How do you exit Visual mode?", "o": ["Press Ctrl+Z", "Press the same key that entered it again (or Esc)", "Type :q", "Press u"], "a": 1, "e": "再按一次同樣的按鍵就能離開 Visual Mode。", "s": 6}, {"q": "If you are unsure which mode you are in, what is a safe action?", "o": ["Type :wq immediately", "Press Esc a few times to return to Command mode", "Press Ctrl+C to quit Vim", "Close the terminal"], "a": 1, "e": "連按幾次 Esc 就能回到 Command Mode，在 Command Mode 中重複按 Esc 是安全的。", "s": 6}, {"q": "Which key moves the cursor down in Command mode?", "o": ["k", "h", "j", "l"], "a": 2, "e": "h 向左、j 向下、k 向上、l 向右。", "s": 7}, {"q": "Which key moves the cursor up in Command mode?", "o": ["k", "j", "h", "l"], "a": 0, "e": "k 向上移動 (口訣 kick)。", "s": 7}, {"q": "Which key moves the cursor left in Command mode?", "o": ["h", "j", "k", "l"], "a": 0, "e": "h 向左移動 (口訣 hang)。", "s": 7}, {"q": "Which key moves the cursor right in Command mode?", "o": ["j", "h", "k", "l"], "a": 3, "e": "l 向右移動 (口訣 leap)。", "s": 7}, {"q": "Why does vi use the h, j, k, and l keys for cursor movement?", "o": ["They are reserved for root", "They were chosen randomly", "They are the only keys Linux supports", "Early terminals did not always have reliable arrow keys"], "a": 3, "e": "早期使用者不一定有可靠的方向鍵，因此 vi 用排在一起的 H J K L 移動游標。", "s": 7}, {"q": "Which key deletes a single character in Command mode?", "o": ["u", "p", "x", "d"], "a": 2, "e": "x 刪除游標位置的單一字元。", "s": 7}, {"q": "Which key undoes the most recent edit in Command mode?", "o": ["z", "r", "u", "x"], "a": 2, "e": "u 復原最近一次的編輯。", "s": 7}, {"q": "Which key appends text at the end of the current line?", "o": ["O", "I", "A", "P"], "a": 2, "e": "大寫 A 在目前行的結尾附加文字並進入 Insert Mode。", "s": 7}, {"q": "What is the basic Vim workflow?", "o": ["Open the file, press u, then x", "Open the file, enter Insert mode, press Esc, then save or quit with a colon command", "Open the file, press Ctrl+S, close the terminal", "Open the file, press :i, type text, press Enter"], "a": 1, "e": "基本流程為開啟 → 進入編輯 → Esc → 以 :w、:wq 或 :q! 儲存或離開。", "s": 8}, {"q": "Which command saves the file and stays in Vim to continue editing?", "o": [":q!", ":w", ":wq", ":x!"], "a": 1, "e": ":w 寫入檔案並繼續停在 Command Mode。", "s": 8}, {"q": "Which command saves the file and quits Vim immediately?", "o": [":e", ":q!", ":wq", ":w"], "a": 2, "e": ":wq 儲存檔案後立即離開 Vim。", "s": 8}, {"q": "Which command quits Vim and discards all changes since the last write?", "o": [":w!", ":wq", ":u", ":q!"], "a": 3, "e": ":q! 放棄上一次寫入之後所做的所有變更並強制離開。", "s": 8}, {"q": "Why can discarding changes with :q! be the safer choice?", "o": ["It creates an automatic backup", "It encrypts the file", "It avoids leaving a critical file in an incorrect state", "It restarts the service using the file"], "a": 2, "e": "有時丟掉變更比把關鍵檔案留在錯誤狀態更安全。", "s": 8}, {"q": "In Vim, what does yank mean?", "o": ["Copy the selected text into memory", "Paste text", "Delete the entire file", "Undo the last change"], "a": 0, "e": "yank (y) 把選取內容複製到記憶體，put (p) 貼上。", "s": 9}, {"q": "After yanking text, which key puts it at the cursor position?", "o": ["y", "i", "v", "p"], "a": 3, "e": "移動游標到新位置後按 p，把內容 put 到游標處。", "s": 9}, {"q": "Which key combination enters Visual Line mode?", "o": ["Shift+V", "Ctrl+V", "v", "Alt+V"], "a": 0, "e": "Shift+V 是行模式，畫面下方顯示 VISUAL LINE。", "s": 9}, {"q": "Which key combination enters Visual Block mode?", "o": ["Ctrl+V", "v", "Ctrl+B", "Shift+V"], "a": 0, "e": "Ctrl+V 是區塊模式，畫面下方顯示 VISUAL BLOCK。", "s": 9}, {"q": "What does the bottom of the screen show in character Visual mode?", "o": ["VISUAL LINE", "VISUAL", "VISUAL BLOCK", "INSERT"], "a": 1, "e": "v 字元模式畫面下方顯示 VISUAL。", "s": 9}, {"q": "Which Visual mode is useful for working with columns in data files?", "o": ["Character Visual mode", "Visual Block mode", "Visual Line mode", "Insert mode"], "a": 1, "e": "區塊模式適合處理資料檔，可用方向鍵標示要修改的矩形區塊。", "s": 9}, {"q": "Which file changes Vim behavior for the whole system?", "o": ["/etc/vim.conf", "~/.vimrc", "/etc/vimrc", "/usr/share/vim/user.conf"], "a": 2, "e": "/etc/vimrc 影響整個系統的 Vim 行為。", "s": 9}, {"q": "Which file changes Vim behavior only for the current user?", "o": ["/etc/skel/vim", "~/.vimrc", "/etc/vimrc", "~/.bashrc"], "a": 1, "e": "家目錄下的 ~/.vimrc 只影響目前使用者。", "s": 9}, {"q": "Which settings could you customize in a vimrc file?", "o": ["Disk partitions", "Firewall rules", "Kernel modules", "Default tab spacing, syntax highlighting, and color themes"], "a": 3, "e": "vimrc 可自訂 Tab 間距、語法高亮與色彩主題等。", "s": 9}, {"q": "Which command starts the interactive Vim tutorial?", "o": ["vim --tutor", "man vimtutor", "vimhelp", "vimtutor"], "a": 3, "e": "在 servera 執行 vimtutor 完成互動式學習。", "s": 11}, {"q": "Which vimtutor lesson teaches how to quit without saving?", "o": ["Lesson 1.2", "Lesson 1.6", "Lesson 1.1", "Lesson 1.4"], "a": 0, "e": "Lesson 1.2 學習不儲存強制離開 :q!。", "s": 11}, {"q": "Which vimtutor lesson teaches saving and quitting with :wq?", "o": ["Lesson 1.5", "Lesson 1.3", "Lesson 1.2", "Lesson 1.6"], "a": 3, "e": "Lesson 1.6 使用 :wq 儲存並離開。", "s": 11}, {"q": "Which vimtutor lesson teaches deleting a single character with x?", "o": ["Lesson 1.3", "Lesson 1.4", "Lesson 1.1", "Lesson 1.5"], "a": 0, "e": "Lesson 1.3 以 x 鍵刪除單一字元。", "s": 11}, {"q": "What happens if vimtutor cannot find a localized version?", "o": ["It is normal; Vim automatically uses the English version", "It downloads the localized version", "It opens in Visual mode", "vimtutor fails to start"], "a": 0, "e": "找不到本地化版本是正常現象，Vim 會自動使用英文版。", "s": 11}, {"q": "How many lessons in the guided exercise are required by the course?", "o": ["Lessons 1 through 3", "None", "All seven lessons", "Only Lesson 1"], "a": 3, "e": "課程只要求完成 Lesson 1，其餘 6 個 Lesson 可自行探索。", "s": 11}, {"q": "Which package includes vimtutor?", "o": ["vim-minimal", "vim-common-tools", "vim-enhanced", "vi-tutor"], "a": 2, "e": "自我測驗：vimtutor 包含在 vim-enhanced 套件中。", "s": 13}, {"q": "Which command prepares the environment for the vimtutor guided exercise?", "o": ["lab finish edit-file", "lab start vimtutor", "lab start edit-file", "vim --setup"], "a": 2, "e": "在 workstation 執行 lab start edit-file，再 ssh 登入 servera。", "s": 11}] };</script>
