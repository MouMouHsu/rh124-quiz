<script>window.QUIZ = { key: "CH17", questions: [{"q": "How many layers does the TCP/IP network model have?", "o": ["3", "4", "5", "7"], "a": 1, "e": "TCP/IP 模型共 4 層：應用層、傳輸層、網際網路層與鏈路層。", "s": 4}, {"q": "Which RFC specifies the TCP/IP protocols, according to the chapter?", "o": ["RFC 2616", "RFC 1918", "RFC 1122", "RFC 7217"], "a": 2, "e": "TCP/IP 協定由 RFC 1122 規範。", "s": 4}, {"q": "Which TCP/IP layer includes SSH, HTTPS, FTP, and SMTP?", "o": ["Application layer", "Transport layer", "Internet layer", "Link layer"], "a": 0, "e": "應用層提供各種高階應用協定，如 SSH、HTTPS、FTP、SMTP。", "s": 4}, {"q": "Which transport protocol is connectionless and faster but less reliable?", "o": ["IP", "UDP", "ICMP only", "TCP"], "a": 1, "e": "TCP 提供可靠連線導向通訊，UDP 是無連線的資料報協定。", "s": 4}, {"q": "At which TCP/IP layer do routers connect different networks?", "o": ["Internet layer", "Link layer", "Transport layer", "Application layer"], "a": 0, "e": "網際網路層負責跨網路把封包送到目的 Host，路由器在這一層連接不同網路。", "s": 4}, {"q": "What does the Link layer use to identify the destination of packets on a local network?", "o": ["Port numbers", "MAC addresses", "Host names", "IP addresses"], "a": 1, "e": "鏈路層使用 MAC 位址識別區域網路上的封包目的地。", "s": 4}, {"q": "Why is the OSI model still used as a reference although TCP/IP is the standard?", "o": ["It has a more detailed structure that is useful for in-depth study", "It replaced TCP/IP in RHEL 10", "It has fewer layers", "It is required by RHEL"], "a": 0, "e": "OSI 模型因結構更細，仍是常用的教學參考。", "s": 5}, {"q": "When someone says Layer 3 is IP, which model's numbering are they using?", "o": ["The Ethernet model", "The DNS model", "The OSI model", "The TCP/IP model"], "a": 2, "e": "第二層 Ethernet、第三層 IP、第四層 TCP 這些數字對應 OSI 模型。", "s": 5}, {"q": "On what are consistent network interface names in RHEL based?", "o": ["The MAC address only", "Firmware information, PCI bus topology, and device type", "Detection order at boot", "Random numbers"], "a": 1, "e": "名稱依 Firmware 資訊、PCI 匯流排拓撲與裝置類型，而非偵測順序。", "s": 6}, {"q": "Which interface name prefix indicates a wireless LAN interface?", "o": ["ww", "en", "wl", "lo"], "a": 2, "e": "en 是 Ethernet、wl 是無線區域網路、ww 是無線廣域網路。", "s": 6}, {"q": "What does the interface name eno1 indicate?", "o": ["A loopback device", "An onboard Ethernet device", "A wireless WAN device", "A PCI hot-plug slot device"], "a": 1, "e": "oN 代表板載 (Onboard) 裝置，例如 eno1。", "s": 6}, {"q": "What does the interface name enp2s0 indicate?", "o": ["Onboard device 2", "Wireless device 2", "An Ethernet device on PCI bus 2, slot 0", "A virtual bridge"], "a": 2, "e": "pMsN 代表 PCI 匯流排 M 的 Slot N。", "s": 6}, {"q": "Why were names such as eth0 replaced?", "o": ["They were too long", "They did not support IPv6", "They were reserved for Wi-Fi", "Their mapping could change when devices were added or removed"], "a": 3, "e": "早期 eth0 這類名稱在裝置增減時對應可能改變。", "s": 6}, {"q": "How many bits does an IPv4 address have?", "o": ["48", "64", "32", "128"], "a": 2, "e": "IPv4 位址是 32 位元，以四個 8 位元十進位數字表示。", "s": 8}, {"q": "What determines which part of an IPv4 address is the network prefix?", "o": ["The netmask", "The default gateway", "The MAC address", "The DNS server"], "a": 0, "e": "Netmask 長度代表有多少位元屬於網路前綴。", "s": 8}, {"q": "Can hosts on the same subnet communicate directly without a router?", "o": ["Only if they use DHCP", "Only over IPv6", "No, they always need a router", "Yes, because they share the same network prefix"], "a": 3, "e": "同一子網路的 Host 有相同網路前綴，不需路由器即可直接通訊。", "s": 8}, {"q": "How many usable host addresses does a /24 network provide?", "o": ["254", "255", "65,534", "256"], "a": 0, "e": "/24 剩下 8 位元，可用 Host 數為 254。", "s": 8}, {"q": "What is the network address of 192.168.1.107/24?", "o": ["192.168.1.255", "192.168.1.1", "192.168.1.0", "192.168.0.0"], "a": 2, "e": "IP AND Netmask (255.255.255.0) = 192.168.1.0。", "s": 9}, {"q": "Which dotted-decimal netmask corresponds to /19?", "o": ["255.255.192.0", "255.255.224.0", "255.255.255.224", "255.255.240.0"], "a": 1, "e": "/19 = 19 個 1 位元，即 255.255.224.0。", "s": 9}, {"q": "What is the network address of 172.16.181.23/19?", "o": ["172.16.176.0", "172.16.181.0", "172.16.128.0", "172.16.160.0"], "a": 3, "e": "以 /19 做 AND 運算，網路位址為 172.16.160.0。", "s": 9}, {"q": "What is the broadcast address of 172.16.181.23/19?", "o": ["172.16.160.255", "172.16.255.255", "172.16.191.255", "172.16.181.255"], "a": 2, "e": "Table 17.2：廣播位址為 172.16.191.255。", "s": 10}, {"q": "How many usable host addresses does a /19 network provide?", "o": ["8190", "4094", "8192", "16382"], "a": 0, "e": "/19 剩下 13 位元，可用 Host 數為 8190。", "s": 10}, {"q": "What is the broadcast address of 10.1.1.18/8?", "o": ["10.1.255.255", "10.255.255.255", "10.0.0.255", "10.1.1.255"], "a": 1, "e": "Table 17.3：/8 網路的廣播位址為 10.255.255.255。", "s": 10}, {"q": "Which RHEL tool calculates network address, broadcast, and host range for a subnet?", "o": ["tracepath", "ipcalc", "ip route", "ss"], "a": 1, "e": "RHEL 在 BaseOS 中提供 ipcalc 協助子網路計算。", "s": 12}, {"q": "When multiple routing table entries match a destination, which one does the host use?", "o": ["The entry with the longest prefix", "The first entry in the table", "The entry with the lowest metric only", "The default route"], "a": 0, "e": "有多個有效項目時使用前綴較長 (最精確) 的項目。", "s": 13}, {"q": "Which IPv4 routing table entry represents the default route?", "o": ["255.255.255.255/32", "192.168.0.0/16", "0.0.0.0/0", "127.0.0.1/8"], "a": 2, "e": "預設路由 0.0.0.0/0 在其他路由都不符合時使用，通常指向 gateway。", "s": 13}, {"q": "Where must the default route point?", "o": ["To the loopback interface", "To the DNS server", "To any internet host", "To a router on a local subnet that the host can reach"], "a": 3, "e": "預設路由必須指向 Host 可到達的本地子網路上的路由器。", "s": 13}, {"q": "In Table 17.4, how does hostb send traffic to a host on 192.168.6.0/24?", "o": ["Directly through enp0s2f0 without a router", "Through the router 192.168.5.1", "It cannot reach that network", "Through the loopback interface"], "a": 0, "e": "hostb 有介面連接該網路，直接透過 enp0s2f0 傳送。", "s": 14}, {"q": "What does a DHCP client do first to obtain an IPv4 configuration?", "o": ["Sends a router solicitation", "Reads /etc/hosts", "Sends a ping to the gateway", "Broadcasts a discover request on the local segment"], "a": 3, "e": "DHCP Client 在本地網段廣播探索請求，尋找可用的 DHCP 伺服器。", "s": 16}, {"q": "What must a DHCP client do to keep using its assigned address?", "o": ["Periodically renew the lease", "Disable IPv6", "Reboot every day", "Change its MAC address"], "a": 0, "e": "指派在租約期間有效，Client 必須定期續租。", "s": 16}, {"q": "How many bits does an IPv6 address have?", "o": ["128", "64", "32", "256"], "a": 0, "e": "IPv6 位址為 128 位元，寫成八組以冒號分隔的四位十六進位數字。", "s": 17}, {"q": "How many times can :: appear in an IPv6 address?", "o": ["Twice", "Never", "Only once", "Unlimited"], "a": 2, "e": "雙冒號在一個位址中只能出現一次，以避免含糊。", "s": 17}, {"q": "What is the recommended abbreviation of 2001:0db8:0000:0010:0000:0000:0000:0001?", "o": ["2001:db8:0:10:0:0:0:1", "2001:db8:0:10::1", "2001:0db8:0:10::0001", "2001:db8::10::1"], "a": 1, "e": "省略前導 0 並以 :: 取代最長的連續 0 群組。", "s": 17}, {"q": "Should you use :: to shorten a single group of zeros?", "o": ["Only at the end of an address", "No; use :0: instead", "Yes, always", "Only in link-local addresses"], "a": 1, "e": "不要用 :: 縮短單一組零，改用 :0:。", "s": 17}, {"q": "Which letter case is recommended for hexadecimal digits in IPv6 addresses?", "o": ["Uppercase", "Either; it is required to be uppercase", "Lowercase", "Mixed case"], "a": 2, "e": "十六進位字母一律用小寫。", "s": 17}, {"q": "What prefix length do most typical IPv6 unicast subnets use?", "o": ["/24", "/48", "/128", "/64"], "a": 3, "e": "典型單播位址使用 64 位元前綴，另一半為介面識別碼。", "s": 18}, {"q": "If an ISP allocates a /48 prefix, how many /64 subnets can the organization create?", "o": ["256", "16,777,216", "65,536", "4,096"], "a": 2, "e": "剩下 16 位元可自行定義子網路，即 2^16 = 65,536 個。", "s": 18}, {"q": "Which IPv6 address is the loopback address, equivalent to 127.0.0.1?", "o": ["fe80::/10", "::1/128", "ff02::1", "::/0"], "a": 1, "e": "::1/128 是 localhost，設定在 loopback 介面。", "s": 20}, {"q": "Which IPv6 prefix is used for link-local addresses that every IPv6 interface configures automatically?", "o": ["fe80::/10", "2000::/3", "fd00::/8", "ff00::/8"], "a": 0, "e": "fe80::/10 為 link-local，只在本地鏈路有效，無法跨 Router 路由。", "s": 20}, {"q": "Which IPv6 prefix is unique local address space, similar to RFC 1918 private addresses?", "o": ["::/0", "2000::/3", "fe80::/10", "fd00::/8"], "a": 3, "e": "fd00::/8 為唯一本地位址，類似 RFC 1918 私有空間。", "s": 20}, {"q": "Why is multicast especially important in IPv6?", "o": ["IPv6 requires a router for all traffic", "IPv6 does not use broadcast addresses", "IPv6 has no unicast addresses", "Multicast is faster than unicast"], "a": 1, "e": "IPv6 不使用廣播位址，因此一對多的 multicast 功能特別重要。", "s": 20}, {"q": "To which multicast address does a DHCPv6 client send its request?", "o": ["::1 on UDP port 53", "ff02::2 on UDP port 67", "ff02::1:2 on UDP port 547", "ff02::1 on TCP port 546"], "a": 2, "e": "DHCPv6 從 link-local 位址傳送到 ff02::1:2 的 UDP Port 547，回覆到 Client 的 Port 546。", "s": 21}, {"q": "How does SLAAC build a complete IPv6 address?", "o": ["The host combines the router-advertised prefix with an automatically generated interface ID", "A DHCPv6 server assigns it", "It is copied from IPv4", "The administrator types it manually"], "a": 0, "e": "Host 向 ff02::2 傳送 router solicitation，路由器回應前綴，Host 加上自動產生的介面識別碼。", "s": 21}, {"q": "Which IPv6 address is invalid?", "o": ["::1", "2001:db8::7:2", "fe80::1", "2001:db8::7::2"], "a": 3, "e": "含兩個 :: 的位址無效，因為 :: 只能出現一次。", "s": 22}, {"q": "Which command lists all network interfaces and their MAC addresses?", "o": ["ip route", "ping -c3", "ss -tan", "ip link show"], "a": 3, "e": "ip link 列出所有網路介面，MAC 位址在 link/ether 那一行。", "s": 24}, {"q": "In ip addr show output, what does scope link indicate?", "o": ["The address is a loopback", "The address is routable on the internet", "The interface is down", "The address can reach only neighbors on the same link"], "a": 3, "e": "global 範圍可在網際網路路由，link 範圍只能到達同一鏈路上的鄰居。", "s": 24}, {"q": "Which command shows RX and TX statistics such as packets, errors, and dropped packets?", "o": ["ss -s", "ip addr show", "ip route", "ip -s link show"], "a": 3, "e": "ip -s link 顯示收發封包、錯誤與丟棄的統計。", "s": 24}, {"q": "What must you add when pinging an IPv6 link-local address?", "o": ["A scope identifier with % and the interface name", "The -4 option", "A port number", "The MAC address"], "a": 0, "e": "ping link-local 位址需加 %interface，例如 ping6 fe80::...%ens4。", "s": 25}, {"q": "Which command shows the IPv6 routing table?", "o": ["tracepath -r", "ip -6 route", "ss -6", "ip route6"], "a": 1, "e": "ip -6 route 顯示 IPv6 路由表。", "s": 26}, {"q": "Which tool replaced netstat for displaying socket statistics?", "o": ["mtr", "ip", "ifconfig", "ss"], "a": 3, "e": "ss 已取代早期 net-tools 套件中的 netstat。", "s": 27}] };</script>
